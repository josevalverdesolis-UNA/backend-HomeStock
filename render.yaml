services:
  - type: web
    name: homestock-backend
    env: docker
    region: virginia
    plan: free
    autoDeploy: true

    # Docker build (proyecto en la raíz del repo)
    # Si configuras el servicio vía UI, usa Root Directory vacío
    dockerfilePath: backend-HomeStock/Dockerfile
    dockerContext: backend-HomeStock

    # Health check fiable usando SpringDoc
    healthCheckPath: /v1/api-docs

    envVars:
      # Usa la URL JDBC completa: jdbc:postgresql://HOST:PORT/DB?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Perfil recomendado para producción
      - key: SPRING_PROFILES_ACTIVE
        value: prod
