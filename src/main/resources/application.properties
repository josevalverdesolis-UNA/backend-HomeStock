# ==============================
#  SERVIDOR
# ==============================
server.port=${PORT:8080}
spring.application.name=homestock-backend

# ==============================
#  BASE DE DATOS (PostgreSQL)
#  Local por defecto; en Render setea:
#  - SPRING_DATASOURCE_URL
#  - SPRING_DATASOURCE_USERNAME
#  - SPRING_DATASOURCE_PASSWORD
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homestockapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:homestockapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
#  JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ==============================
#  FLYWAY
# ==============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:bd/migration

# ==============================
#  JACKSON (JSON)
# ==============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true

# ==============================
#  LOGGING
# ==============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=${LOG_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_SQL_BIND:TRACE}
logging.level.org.flywaydb.core=INFO

# ==============================
#  ERRORES (API REST)
# ==============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# ==============================
#  ACTUATOR
# ==============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator

# ==============================
#  OPENAPI / SWAGGER-UI
# ==============================
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui
