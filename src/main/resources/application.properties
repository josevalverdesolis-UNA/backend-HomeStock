# ==============================
#  SERVIDOR
# ==============================
server.port=${PORT:8080}
spring.application.name=homestock-backend

# ==============================
#  BASE DE DATOS (PostgreSQL)
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homestockapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:homestockapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
#  JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

# ==============================
#  FLYWAY (apagado por ahora)
# ==============================
spring.flyway.enabled=false
spring.flyway.locations=classpath:bd/migration
# spring.flyway.baseline-on-migrate=true

# ==============================
#  ACTUATOR
# ==============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator

# ==============================
#  OPENAPI / SWAGGER-UI
# ==============================
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui
