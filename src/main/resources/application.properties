# ==============================
#  SERVIDOR
# ==============================
server.port=${PORT:8080}
spring.application.name=homestock-backend

# ==============================
#  BASE DE DATOS (PostgreSQL en Render)
# ==============================
# Estas variables deben venir del entorno (Render o local)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
#  JPA / HIBERNATE
# ==============================
# Valida que el esquema DB coincida con las entidades JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

# ==============================
#  FLYWAY (habilitado)
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:bd/migration

# ==============================
#  ACTUATOR
# ==============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator

# ==============================
#  OPENAPI / SWAGGER-UI
# ==============================
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui
# ==============================
# JWT
# ==============================
app.jwt.secret=${JWT_SECRET:change-this-in-prod-min-32-chars-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.jwt.issuer=homestock
app.jwt.expiration-minutes=60
