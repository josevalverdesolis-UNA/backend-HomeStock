# ==============================
#  SERVIDOR
# ==============================
server.port=${PORT:8080}
spring.application.name=homestock-backend

# ==============================
#  BASE DE DATOS (PostgreSQL en Render)
# ==============================
# Render define estas variables de entorno. Asegúrate de que la URL JDBC incluya '?sslmode=require'.
# Ejemplo:
# SPRING_DATASOURCE_URL=jdbc:postgresql://<HOST>:5432/<DB>?sslmode=require
# SPRING_DATASOURCE_USERNAME=usuario_render
# SPRING_DATASOURCE_PASSWORD=contraseña_render
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
#  JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

# ==============================
#  FLYWAY (deshabilitado por defecto)
# ==============================
spring.flyway.enabled=false
spring.flyway.locations=classpath:bd/migration
# Para activar por env en Render: SPRING_FLYWAY_ENABLED=true
# spring.flyway.baseline-on-migrate=true

# ==============================
#  ACTUATOR
# ==============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator

# ==============================
#  OPENAPI / SWAGGER-UI
# ==============================
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui
