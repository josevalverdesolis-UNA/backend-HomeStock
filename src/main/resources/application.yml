server:
  port: 8080
spring:
  application:
    name: homestock-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/homestockapp
    username: homestockapp
    password: "12345"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      indent_output: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
